name: Benchmark
on:
  pull_request:
    branches:
      - main
      - master

permissions:
  pull-requests: write

concurrency:
  group: benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      # The action checks out the repository, installs Julia and caches packages.
      # The benchmark environment is benchmark/Project.toml.
      - name: Run benchmarks
        uses: MilesCranmer/AirspeedVelocity.jl@action-v1
        with:
          julia-version: '1'
          tune: 'false'
          # Run the pull request's benchmark/benchmarks.jl against both the base
          # branch and the pull request.
          bench-on: ${{ github.event.pull_request.head.sha }}
